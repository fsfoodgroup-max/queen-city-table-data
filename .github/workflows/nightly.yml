name: Nightly restaurant update

on:
  schedule:
    - cron: "17 8 * * *"   # every day around 3:17 AM Eastern
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB
        run: pip install duckdb==2.0.0

      - name: Build restaurant list
        run: python scripts/build_data.py

      - name: Save changes
        run: |
          git config user.name "queen-city-table-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data cache
          if git diff --cached --quiet; then
            echo "No changes tonight."
          else
            git commit -m "Nightly update $(date -u +%Y-%m-%d)"
            git push
          fi
